[Service]
WorkingDirectory=/opt/peik-deploy/current/backend
ExecStart=
ExecStart=/opt/peik-deploy/node/bin/node dist/server.js
Environment=PATH=/opt/peik-deploy/node/bin:/usr/bin:/bin
Environment=NODE_ENV=production
Environment=DOTENV_CONFIG_PATH=/opt/peik-deploy/shared/backend.env
NoNewPrivileges=true
PrivateTmp=true
PrivateDevices=true
ProtectSystem=strict
ProtectHome=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
RestrictSUIDSGID=true
